site_name: DXNN Streamer (DX-STREAM) User Manual
use_directory_urls: false
docs_dir: source # markdown 원문 폴더
site_dir: docs # html로 변환된 폴더
theme: 
  name : material
  language: en
  font:
    text: Noto Sans Display
    code: Roboto Mono 
  logo: img/deepx.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: black
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
     - toc.integrate
     - content.code.annotate
     - navigation.tabs
     - navigation.tabs.sticky
     - content.tabs.link
     - content.code.copy
site_url: 'https://developer.deepx.ai/'
nav:
  - DXNN SDK Overview: docs/01_DXNN_Streamer_Overview.md
  - DX-STREAM Installation: docs/02_DX-STREAM_Installation.md
  - Elements:
      - Multi-Stream Domain: docs/Elements/03_00_Multi_Stream_Domain.md
      - DxPreprocess: docs/Elements/03_01_DxPreprocess.md
      - DxInfer: docs/Elements/03_02_DxInfer.md
      - DxPostprocess: docs/Elements/03_03_DxPostprocess.md
      - DxTracker: docs/Elements/03_04_DxTracker.md
      - DxOsd: docs/Elements/03_05_DxOsd.md
      - DxGather: docs/Elements/03_06_DxGather.md
      - DxInputSelector: docs/Elements/03_07_DxInputSelector.md
      - DxOutputSelector: docs/Elements/03_08_DxOutputSelector.md
      - DxRate: docs/Elements/03_09_DxRate.md
      - DxMsgConv: docs/Elements/03_10_DxMsgConv.md
      - DxMsgBroker: docs/Elements/03_11_DxMsgBroker.md
      - DxScale: docs/Elements/03_12_DxScale.md
      - DxConvert: docs/Elements/03_13_DxConvert.md
  - Writing Your Own Application: docs/04_Writing_Your_Own_Application.md
  - Pipeline Example:
      - Single Stream Pipeline: docs/Pipeline_Example/05_01_Single-Stream.md
      - Multi Stream Pipeline: docs/Pipeline_Example/05_02_Multi-Stream.md      
      - Secondary Inference Pipeline: docs/Pipeline_Example/05_03_Secondary-Inference.md
      - MsgBroker Pipeline: docs/Pipeline_Example/05_04_MsgBroker.md
  - Troubleshooting and FAQ: docs/06_Troubleshooting_and_FAQ.md
  - Debugging Guide: docs/07_Debugging_Guide.md
  - Agent-Driven Development: docs/08_DX-STREAM_Agent_Driven_Development.md
  - Appendix:
      - User Metadata Guide: docs/Appendix_User_Metadata_Guide.md
      - Performance Evaluation with GstShark: docs/Appendix_Performance_Evaluation_with_GstShark.md
      - Build on Orange Pi 5 Plus: docs/Appendix_Build_on_OrangePi5Plus.md
      - Build on Windows: docs/Appendix_Build_on_Windows.md
      - Third-Party Sample Model Licenses: docs/Appendix_Third_Party_Model_Licenses.md
  - Change Log: docs/RELEASE_NOTES.md

plugins:
  - search
  - to-pdf:
      author: DEEPX.ai
      copyright: ⓒ Copyright 2026 DEEPX All Rights Reserved.
      cover_title: DXNN Streamer (DX-STREAM) User Manual
      cover_subtitle: 2026/07/08 (v3.1.0)
      cover_logo: img/deepx.png
      custom_template_path: source/stylesheets
      output_path: ../DEEPX_DX-STREAM_UM_v3.1.0_JUL_2026.pdf
extra:
  homepage: https://developer.deepx.ai
  generator: false
  social:
#     - icon: fontawesome/brands/github
#       link: https://github.com/deepx-ai
     - icon: fontawesome/brands/linkedin
       link: https://www.linkedin.com/company/deepx-corporation/
extra_css: 
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - def_list
  - toc:
        permalink: "true"
        baselevel: 1
        separator: ">_"
        toc_depth: 3
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - ..
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true 
  - attr_list
  - md_in_html
# extra_javascript:
#  - https://polyfill.io/v3/polyfill.min.js?features=es6
copyright: ⓒ Copyright 2026 <a href="http://deepx.ai">DEEPX</a>. All Rights Reserved.
